<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard - จัดการรายจ่ายและผ่อนชำระ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        .tab-container { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; }
        .tab-btn { background: none; border: none; padding: 10px 30px; font-size: 16px; font-weight: bold; cursor: pointer; color: #7f8c8d; border-bottom: 4px solid transparent; transition: 0.3s; }
        .tab-btn:hover { color: #2c3e50; }
        .tab-btn.active { color: #3498db; border-bottom: 4px solid #3498db; }

        .time-selector { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .time-selector button { padding: 8px 16px; cursor: pointer; border: none; background-color: #3498db; color: white; border-radius: 4px; font-weight: bold; }
        .time-selector button:hover { background-color: #2980b9; }
        .time-selector span { font-size: 20px; font-weight: bold; color: #2c3e50; min-width: 150px; text-align: center; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .summary-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .summary-card { flex: 1; text-align: center; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .summary-card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 16px; }
        .summary-card p { margin: 0; font-size: 28px; font-weight: bold; }
        .text-primary { color: #3498db; }
        .text-success { color: #2ecc71; }
        .text-danger { color: #e74c3c; }

        .form-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .form-group div { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        .form-group label { margin-bottom: 5px; font-size: 14px; color: #34495e; font-weight: bold; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-family: inherit; font-size: 14px;}
        
        .installment-highlight { background-color: #fef9e7; padding: 10px; border-radius: 4px; border: 1px dashed #f1c40f; }

        .btn-submit { padding: 10px 20px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: 40px; }
        .btn-submit:hover { background-color: #27ae60; }
        .btn-cancel { padding: 10px 20px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: 40px; display: none; }

        .content { display: flex; gap: 20px; }
        .chart-container { width: 35%; }
        .table-container { width: 65%; overflow-y: auto; max-height: 400px; }
        .content.yearly-layout { flex-direction: column; }
        .content.yearly-layout .chart-container { width: 100%; height: 350px; }
        .content.yearly-layout .table-container { width: 100%; max-height: none; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; color: #2c3e50; position: sticky; top: 0; }
        .paid-row { text-decoration: line-through; color: #bdc3c7; }
        input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }

        .btn-action-edit { background-color: #f1c40f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-action-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard บันทึกรายจ่าย</h1>

        <div class="tab-container">
            <button class="tab-btn active" id="btnTabMonth" onclick="switchView('month')">ดูรายเดือน (จัดการข้อมูล)</button>
            <button class="tab-btn" id="btnTabYear" onclick="switchView('year')">ดูสรุปภาพรวมรายปี</button>
        </div>

        <div id="viewMonthly">
            <div class="time-selector">
                <button onclick="changeMonth(-1)">&#9664; เดือนที่แล้ว</button>
                <span id="monthDisplay">เดือน ปี</span>
                <button onclick="changeMonth(1)">เดือนถัดไป &#9654;</button>
            </div>

            <div class="card">
                <form id="expenseForm">
                    <div class="form-group">
                        <div>
                            <label>วันที่เริ่มจ่าย</label>
                            <input type="date" id="expDate" required>
                        </div>
                        <div style="flex: 2;">
                            <label>ชื่อรายการ</label>
                            <input type="text" id="expItem" placeholder="เช่น ค่าที่ปรึกษาภาษี" required>
                        </div>
                        <div>
                            <label>หมวดหมู่</label>
                            <input type="text" id="expCategory" list="categoryOptions" placeholder="เลือก/พิมพ์" required autocomplete="off">
                            <datalist id="categoryOptions"></datalist>
                        </div>
                        
                        <div>
                            <label>รูปแบบการจ่าย</label>
                            <select id="expPaymentType" onchange="toggleInstallmentUI()">
                                <option value="full">จ่ายเต็มจำนวน</option>
                                <option value="installment">ผ่อนชำระรายเดือน</option>
                            </select>
                        </div>

                        <div id="installmentContainer" class="installment-highlight" style="display: none;">
                            <label>จำนวนเดือนที่ผ่อน</label>
                            <input type="number" id="expInstallmentMonths" value="3" min="2" max="60">
                        </div>

                        <div>
                            <label id="amountLabel">จำนวนเงิน (บาท)</label>
                            <input type="number" id="expAmount" placeholder="ยอดรวมทั้งหมด" min="0" required>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="btn-submit">+ เพิ่มรายจ่าย</button>
                        <button type="button" id="cancelBtn" class="btn-cancel" onclick="cancelEdit()">ยกเลิก</button>
                    </div>
                </form>
            </div>

            <div class="summary-cards">
                <div class="summary-card">
                    <h3>ยอดรวมเดือนนี้</h3>
                    <p id="totalExpenseMonthly" class="text-primary">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>จ่ายแล้ว</h3>
                    <p id="paidExpenseMonthly" class="text-success">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>ยอดค้างชำระ</h3>
                    <p id="pendingExpenseMonthly" class="text-danger">฿0</p>
                </div>
            </div>

            <div class="content">
                <div class="card chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
                <div class="card table-container" style="margin-bottom: 0;">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: center; width: 60px;">สถานะ</th>
                                <th>วันที่</th>
                                <th>รายการ</th>
                                <th>หมวดหมู่</th>
                                <th>จำนวนเงิน</th>
                                <th style="width: 140px;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBodyMonthly"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="viewYearly" style="display: none;">
            <div class="time-selector">
                <button onclick="changeYear(-1)">&#9664; ปีก่อนหน้า</button>
                <span id="yearDisplay">ปี 2026</span>
                <button onclick="changeYear(1)">ปีถัดไป &#9654;</button>
            </div>

            <div class="summary-cards">
                <div class="summary-card">
                    <h3>ยอดรวมทั้งปี</h3>
                    <p id="totalExpenseYearly" class="text-primary">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>จ่ายแล้วทั้งปี</h3>
                    <p id="paidExpenseYearly" class="text-success">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>ค้างชำระทั้งหมด</h3>
                    <p id="pendingExpenseYearly" class="text-danger">฿0</p>
                </div>
            </div>

            <div class="content yearly-layout">
                <div class="card chart-container">
                    <canvas id="yearlyChart"></canvas>
                </div>
                <div class="card table-container" style="margin-bottom: 0;">
                    <table>
                        <thead>
                            <tr>
                                <th>เดือน</th>
                                <th>ยอดรวมรายจ่าย</th>
                                <th>จ่ายชำระแล้ว</th>
                                <th>ค้างชำระ</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBodyYearly"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. ข้อมูลและสถานะ (กลับมาใช้ LocalStorage ปกติ ไม่พึ่งพา Firebase) ---
        let expenses = loadData();
        let currentDateView = new Date(); 
        let currentYearView = new Date().getFullYear();
        let editingId = null; 

        function loadData() {
            const savedData = localStorage.getItem('myExpenseDataV4');
            if (savedData) {
                return JSON.parse(savedData);
            } else {
                return [];
            }
        }

        function saveData() {
            localStorage.setItem('myExpenseDataV4', JSON.stringify(expenses));
            updateCategoryDatalist();
        }

        // --- 2. ฟังก์ชัน UI ผ่อนชำระ และ หมวดหมู่ ---
        function toggleInstallmentUI() {
            const paymentType = document.getElementById('expPaymentType').value;
            const installmentDiv = document.getElementById('installmentContainer');
            const amountLabel = document.getElementById('amountLabel');

            if (paymentType === 'installment') {
                installmentDiv.style.display = 'flex';
                amountLabel.innerText = 'ยอดรวมทั้งหมด (บาท)';
            } else {
                installmentDiv.style.display = 'none';
                amountLabel.innerText = 'จำนวนเงิน (บาท)';
            }
        }

        function updateCategoryDatalist() {
            const datalist = document.getElementById('categoryOptions');
            const uniqueCategories = [...new Set(expenses.map(exp => exp.category))];
            datalist.innerHTML = uniqueCategories.map(cat => `<option value="${cat}">`).join('');
        }

        // --- 3. การจัดการมุมมอง (Tabs) ---
        function switchView(mode) {
            document.getElementById('btnTabMonth').classList.remove('active');
            document.getElementById('btnTabYear').classList.remove('active');
            
            if(mode === 'month') {
                document.getElementById('btnTabMonth').classList.add('active');
                document.getElementById('viewMonthly').style.display = 'block';
                document.getElementById('viewYearly').style.display = 'none';
                updateMonthlyDashboard();
            } else {
                document.getElementById('btnTabYear').classList.add('active');
                document.getElementById('viewMonthly').style.display = 'none';
                document.getElementById('viewYearly').style.display = 'block';
                updateYearlyDashboard();
            }
        }

        // --- 4. มุมมองรายเดือน ---
        let monthlyChartInstance = null;

        function updateMonthlyDashboard() {
            const options = { year: 'numeric', month: 'long' };
            document.getElementById('monthDisplay').innerText = currentDateView.toLocaleDateString('th-TH', options);

            const year = currentDateView.getFullYear();
            const month = String(currentDateView.getMonth() + 1).padStart(2, '0');
            const currentMonthPrefix = `${year}-${month}`;
            
            const filteredExpenses = expenses.filter(exp => exp.date.startsWith(currentMonthPrefix));
            filteredExpenses.sort((a, b) => new Date(a.date) - new Date(b.date));

            let total = 0, paid = 0, pending = 0;
            const categoryTotals = {};
            const tableBody = document.getElementById('expenseTableBodyMonthly');
            tableBody.innerHTML = ''; 

            if (filteredExpenses.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">ไม่มีข้อมูลรายจ่ายในเดือนนี้</td></tr>';
            }

            filteredExpenses.forEach(exp => {
                total += exp.amount;
                if (exp.isPaid) paid += exp.amount; else pending += exp.amount;

                if (categoryTotals[exp.category]) categoryTotals[exp.category] += exp.amount;
                else categoryTotals[exp.category] = exp.amount;

                const rowClass = exp.isPaid ? 'paid-row' : '';
                const isChecked = exp.isPaid ? 'checked' : '';
                
                tableBody.innerHTML += `<tr class="${rowClass}">
                    <td style="text-align: center;"><input type="checkbox" onchange="togglePayment(${exp.id})" ${isChecked}></td>
                    <td>${exp.date}</td>
                    <td>${exp.item}</td>
                    <td>${exp.category}</td>
                    <td>฿${exp.amount.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                    <td>
                        <button class="btn-action-edit" onclick="editExpense(${exp.id})">แก้ไข</button>
                        <button class="btn-action-delete" onclick="deleteExpense(${exp.id})">ลบ</button>
                    </td>
                </tr>`;
            });

            document.getElementById('totalExpenseMonthly').innerText = '฿' + total.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('paidExpenseMonthly').innerText = '฿' + paid.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('pendingExpenseMonthly').innerText = '฿' + pending.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });

            updateMonthlyChart(categoryTotals);
        }

        function changeMonth(offset) {
            currentDateView.setMonth(currentDateView.getMonth() + offset);
            if(editingId) cancelEdit();
            updateMonthlyDashboard();
        }

        // --- 5. มุมมองรายปี ---
        let yearlyChartInstance = null;
        const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

        function updateYearlyDashboard() {
            document.getElementById('yearDisplay').innerText = `ปี ${currentYearView}`;
            const filteredExpenses = expenses.filter(exp => exp.date.startsWith(currentYearView.toString()));

            let totalYear = 0, paidYear = 0, pendingYear = 0;
            let monthlyData = Array.from({length: 12}, () => ({ total: 0, paid: 0, pending: 0 }));

            filteredExpenses.forEach(exp => {
                totalYear += exp.amount;
                if (exp.isPaid) paidYear += exp.amount; else pendingYear += exp.amount;
                
                // คำนวณแยกตามเดือนให้ถูกต้อง
                const monthIndex = parseInt(exp.date.split('-')[1]) - 1; 
                monthlyData[monthIndex].total += exp.amount;
                if (exp.isPaid) monthlyData[monthIndex].paid += exp.amount; else monthlyData[monthIndex].pending += exp.amount;
            });

            document.getElementById('totalExpenseYearly').innerText = '฿' + totalYear.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('paidExpenseYearly').innerText = '฿' + paidYear.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('pendingExpenseYearly').innerText = '฿' + pendingYear.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });

            const tableBody = document.getElementById('expenseTableBodyYearly');
            tableBody.innerHTML = '';
            let hasData = false;
            monthlyData.forEach((data, index) => {
                if (data.total > 0) {
                    hasData = true;
                    tableBody.innerHTML += `<tr>
                        <td>${monthNames[index]}</td>
                        <td class="text-primary">฿${data.total.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                        <td class="text-success">฿${data.paid.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                        <td class="text-danger">฿${data.pending.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                    </tr>`;
                }
            });

            if(!hasData) tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">ไม่มีข้อมูลรายจ่ายในปีนี้</td></tr>';
            updateYearlyChart(monthlyData);
        }

        function changeYear(offset) {
            currentYearView += offset;
            updateYearlyDashboard();
        }

        // --- 6. กราฟ ---
        function updateMonthlyChart(dataTotals) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if (monthlyChartInstance) monthlyChartInstance.destroy();
            const labels = Object.keys(dataTotals);
            const data = Object.values(dataTotals);

            if(labels.length === 0) {
                 monthlyChartInstance = new Chart(ctx, { type: 'pie', data: { labels: ['ไม่มีข้อมูล'], datasets: [{ data: [1], backgroundColor: ['#ecf0f1'] }] }});
                 return;
            }

            monthlyChartInstance = new Chart(ctx, {
                type: 'pie',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: ['#3498db', '#e67e22', '#9b59b6', '#2ecc71', '#f1c40f', '#e74c3c'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function updateYearlyChart(monthlyData) {
            const ctx = document.getElementById('yearlyChart').getContext('2d');
            if (yearlyChartInstance) yearlyChartInstance.destroy();
            const chartData = monthlyData.map(data => data.total);

            yearlyChartInstance = new Chart(ctx, {
                type: 'bar', 
                data: { 
                    labels: monthNames, 
                    datasets: [{ 
                        label: 'ยอดใช้จ่ายรวม (บาท)', 
                        data: chartData, 
                        backgroundColor: '#3498db', 
                        borderRadius: 4,
                        minBarLength: 5 // <-- จุดที่แก้ไข: บังคับให้แท่งที่ค่ามากกว่า 0 สูงอย่างน้อย 5px เสมอ
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { y: { beginAtZero: true } } 
                }
            });
        }

        // --- 7. การจัดการข้อมูล (แก้ไข/ลบ/Submit) ---
        window.togglePayment = function(id) {
            const expenseIndex = expenses.findIndex(exp => exp.id === id);
            if (expenseIndex !== -1) {
                expenses[expenseIndex].isPaid = !expenses[expenseIndex].isPaid;
                saveData(); updateMonthlyDashboard();
            }
        };

        window.deleteExpense = function(id) {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้?')) {
                expenses = expenses.filter(exp => exp.id !== id);
                if (editingId === id) cancelEdit();
                saveData(); updateMonthlyDashboard();
            }
        };

        window.editExpense = function(id) {
            const target = expenses.find(exp => exp.id === id);
            if (target) {
                editingId = id;
                document.getElementById('expDate').value = target.date;
                document.getElementById('expItem').value = target.item;
                document.getElementById('expCategory').value = target.category;
                document.getElementById('expAmount').value = target.amount;
                
                document.getElementById('expPaymentType').value = 'full';
                document.getElementById('expPaymentType').disabled = true; 
                toggleInstallmentUI();

                document.getElementById('submitBtn').innerText = '💾 บันทึกการแก้ไข';
                document.getElementById('submitBtn').style.backgroundColor = '#f1c40f';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.getElementById('expenseForm').scrollIntoView({ behavior: 'smooth' });
            }
        };

        window.cancelEdit = function() {
            editingId = null;
            document.getElementById('expenseForm').reset();
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
            
            document.getElementById('expPaymentType').disabled = false;
            toggleInstallmentUI(); 

            document.getElementById('submitBtn').innerText = '+ เพิ่มรายจ่าย';
            document.getElementById('submitBtn').style.backgroundColor = '#2ecc71';
            document.getElementById('cancelBtn').style.display = 'none';
        };

        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const inputDateStr = document.getElementById('expDate').value;
            const inputItem = document.getElementById('expItem').value;
            const inputCategory = document.getElementById('expCategory').value;
            const totalAmount = parseFloat(document.getElementById('expAmount').value);
            const paymentType = document.getElementById('expPaymentType').value;

            if (editingId !== null) {
                const index = expenses.findIndex(exp => exp.id === editingId);
                if (index !== -1) {
                    expenses[index].date = inputDateStr;
                    expenses[index].item = inputItem;
                    expenses[index].category = inputCategory;
                    expenses[index].amount = totalAmount;
                }
            } else {
                if (paymentType === 'installment') {
                    const monthsCount = parseInt(document.getElementById('expInstallmentMonths').value);
                    const amountPerMonth = totalAmount / monthsCount; 
                    const startDate = new Date(inputDateStr);

                    for (let i = 0; i < monthsCount; i++) {
                        let nextDate = new Date(startDate.getFullYear(), startDate.getMonth() + i, startDate.getDate());
                        
                        let yyyy = nextDate.getFullYear();
                        let mm = String(nextDate.getMonth() + 1).padStart(2, '0');
                        let dd = String(nextDate.getDate()).padStart(2, '0');
                        let formattedDate = `${yyyy}-${mm}-${dd}`;

                        expenses.push({ 
                            id: Date.now() + i, 
                            date: formattedDate, 
                            item: `${inputItem} (งวดที่ ${i+1}/${monthsCount})`, 
                            category: inputCategory, 
                            amount: amountPerMonth, 
                            isPaid: false 
                        });
                    }
                } else {
                    expenses.push({ 
                        id: Date.now(), 
                        date: inputDateStr, 
                        item: inputItem, 
                        category: inputCategory, 
                        amount: totalAmount, 
                        isPaid: false 
                    });
                }
            }

            saveData();
            currentDateView = new Date(inputDateStr); 
            updateMonthlyDashboard();
            cancelEdit();
        });

        // --- 8. เริ่มต้นทำงาน (Initialize) ---
        document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
        updateCategoryDatalist(); 
        switchView('month');

    </script>
</body>
</html>
