<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Web App - ลงชื่อเข้าใช้ด้วย Google</title>
    <!-- นำเข้า Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; }
        
        /* สไตล์สำหรับหน้า Login */
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-google { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-top: 20px; }
        .btn-google:hover { background-color: #357ae8; }

        /* ส่วนหัวของแอปเมื่อล็อกอินแล้ว (Header) */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; }
        .btn-logout { background-color: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background-color: #c0392b; }

        /* ... (สไตล์เดิมของ Dashboard คงไว้ทั้งหมด) ... */
        .tab-container { display: flex; justify-content: center; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 30px; font-size: 16px; font-weight: bold; cursor: pointer; color: #7f8c8d; border-bottom: 4px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: #3498db; border-bottom: 4px solid #3498db; }
        .time-selector { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .time-selector button { padding: 8px 16px; cursor: pointer; border: none; background-color: #3498db; color: white; border-radius: 4px; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .summary-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .summary-card { flex: 1; text-align: center; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .summary-card p { margin: 0; font-size: 28px; font-weight: bold; }
        .text-primary { color: #3498db; } .text-success { color: #2ecc71; } .text-danger { color: #e74c3c; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .form-group div { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; }
        .btn-submit { padding: 10px 20px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: 40px; }
        .content { display: flex; gap: 20px; }
        .chart-container { width: 35%; }
        .table-container { width: 65%; overflow-y: auto; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; position: sticky; top: 0; }
        .paid-row { text-decoration: line-through; color: #bdc3c7; }
        .btn-action-edit { background-color: #f1c40f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;}
        .btn-action-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;}
        .installment-highlight { background-color: #fef9e7; padding: 10px; border-radius: 4px; border: 1px dashed #f1c40f; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 1. หน้าจอ Login (จะแสดงเมื่อยังไม่ได้เข้าสู่ระบบ) -->
        <div id="loginScreen">
            <div class="login-box">
                <h2>ยินดีต้อนรับสู่แอปพลิเคชันบัญชีรายจ่าย</h2>
                <p>กรุณาเข้าสู่ระบบเพื่อจัดการข้อมูลส่วนตัวของคุณ</p>
                <button id="btnLogin" class="btn-google">
                    <!-- ไอคอน Google แบบง่ายๆ -->
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    เข้าสู่ระบบด้วย Google
                </button>
            </div>
        </div>

        <!-- 2. หน้าจอ Dashboard (จะถูกซ่อนไว้จนกว่าจะล็อกอินผ่าน) -->
        <div id="appScreen" style="display: none;">
            
            <!-- ส่วนหัวแสดงโปรไฟล์ -->
            <div class="app-header">
                <h1>Dashboard บันทึกรายจ่าย</h1>
                <div class="user-profile">
                    <img id="userAvatar" src="" alt="Profile">
                    <div>
                        <div id="userName" style="font-weight: bold;">ชื่อผู้ใช้</div>
                        <div id="userEmail" style="font-size: 12px; color: #7f8c8d;">อีเมล</div>
                    </div>
                    <button id="btnLogout" class="btn-logout">ออกจากระบบ</button>
                </div>
            </div>

            <!-- ... (โค้ด HTML ส่วน Dashboard เดิมทั้งหมด อยู่ด้านล่างนี้) ... -->
            <div class="tab-container">
                <button class="tab-btn active" id="btnTabMonth" onclick="switchView('month')">ดูรายเดือน</button>
                <button class="tab-btn" id="btnTabYear" onclick="switchView('year')">ดูสรุปรายปี</button>
            </div>

            <!-- มุมมองรายเดือน -->
            <div id="viewMonthly">
                <div class="time-selector">
                    <button onclick="changeMonth(-1)">&#9664;</button>
                    <span id="monthDisplay">เดือน ปี</span>
                    <button onclick="changeMonth(1)">&#9654;</button>
                </div>

                <div class="card">
                    <form id="expenseForm">
                        <div class="form-group">
                            <div><label>วันที่</label><input type="date" id="expDate" required></div>
                            <div style="flex: 2;"><label>ชื่อรายการ</label><input type="text" id="expItem" required></div>
                            <div>
                                <label>หมวดหมู่</label>
                                <input type="text" id="expCategory" list="categoryOptions" required autocomplete="off">
                                <datalist id="categoryOptions"></datalist>
                            </div>
                            <div>
                                <label>รูปแบบ</label>
                                <select id="expPaymentType" onchange="toggleInstallmentUI()">
                                    <option value="full">เต็มจำนวน</option>
                                    <option value="installment">ผ่อนชำระ</option>
                                </select>
                            </div>
                            <div id="installmentContainer" class="installment-highlight" style="display: none;">
                                <label>เดือนที่ผ่อน</label>
                                <input type="number" id="expInstallmentMonths" value="3" min="2">
                            </div>
                            <div><label id="amountLabel">จำนวนเงิน (บาท)</label><input type="number" id="expAmount" min="0" required></div>
                            <button type="submit" id="submitBtn" class="btn-submit">+ เพิ่มรายจ่าย</button>
                        </div>
                    </form>
                </div>

                <div class="summary-cards">
                    <div class="summary-card"><h3>ยอดรวมเดือนนี้</h3><p id="totalExpenseMonthly" class="text-primary">฿0</p></div>
                    <div class="summary-card"><h3>จ่ายแล้ว</h3><p id="paidExpenseMonthly" class="text-success">฿0</p></div>
                    <div class="summary-card"><h3>ค้างชำระ</h3><p id="pendingExpenseMonthly" class="text-danger">฿0</p></div>
                </div>

                <div class="content">
                    <div class="card chart-container"><canvas id="monthlyChart"></canvas></div>
                    <div class="card table-container" style="margin-bottom: 0;">
                        <table>
                            <thead>
                                <tr><th>สถานะ</th><th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th>จำนวนเงิน</th><th>จัดการ</th></tr>
                            </thead>
                            <tbody id="expenseTableBodyMonthly"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- มุมมองรายปี -->
            <div id="viewYearly" style="display: none;">
                <!-- (ละเว้นโครงสร้างรายปีเพื่อให้โค้ดกระชับ โครงสร้างทำงานเหมือนเดิม) -->
                <div class="time-selector">
                    <button onclick="changeYear(-1)">&#9664;</button>
                    <span id="yearDisplay">ปี 2026</span>
                    <button onclick="changeYear(1)">&#9654;</button>
                </div>
                <div class="content"><div class="card chart-container" style="width: 100%;"><canvas id="yearlyChart"></canvas></div></div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- สคริปต์ส่วนที่ 1: ติดตั้ง Firebase (ระบบ Login) -->
    <!-- ========================================== -->
    <script type="module">
        // นำเข้าฟังก์ชันที่จำเป็นจาก Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        // ⚠️ ต้องเปลี่ยนค่าตรงนี้เป็นของโปรเจกต์คุณเองถึงจะทำงานได้จริง ⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // เริ่มต้นระบบ Firebase
        let app, auth, provider;
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch (error) {
            console.error("Firebase Configuration Error: ขาด API Key", error);
        }

        // ตัวแปรเก็บข้อมูลผู้ใช้ปัจจุบัน
        window.currentUser = null;

        // ดักฟังสถานะว่ามีการล็อกอินหรือยัง
        if(auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // ล็อกอินสำเร็จ
                    window.currentUser = user;
                    
                    // แสดงโปรไฟล์
                    document.getElementById('userName').innerText = user.displayName;
                    document.getElementById('userEmail').innerText = user.email;
                    document.getElementById('userAvatar').src = user.photoURL;

                    // ซ่อนหน้า Login และแสดงหน้า App
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appScreen').style.display = 'block';

                    // ⭐️ สั่งให้ระบบ Dashboard โหลดข้อมูลของ "ผู้ใช้นี้" ขึ้นมา
                    window.initializeDashboard();
                } else {
                    // ยังไม่ได้ล็อกอิน หรือกดออกจากระบบ
                    window.currentUser = null;
                    document.getElementById('loginScreen').style.display = 'flex';
                    document.getElementById('appScreen').style.display = 'none';
                }
            });
        }

        // ตั้งค่าปุ่มกด Login
        document.getElementById('btnLogin').addEventListener('click', () => {
            if(!auth) return alert("กรุณาตั้งค่า Firebase API Key ก่อนครับ!");
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Login Failed", error);
                alert("เกิดข้อผิดพลาดในการล็อกอิน");
            });
        });

        // ตั้งค่าปุ่มกด Logout
        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth);
        });
    </script>

    <!-- ========================================== -->
    <!-- สคริปต์ส่วนที่ 2: ระบบ Dashboard เดิม -->
    <!-- ========================================== -->
    <script>
        let expenses = [];
        let currentDateView = new Date(); 
        let currentYearView = new Date().getFullYear();
        let editingId = null; 

        // ฟังก์ชันนี้จะถูกเรียกเมื่อล็อกอินสำเร็จแล้วเท่านั้น
        window.initializeDashboard = function() {
            expenses = loadData();
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
            updateCategoryDatalist();
            updateMonthlyDashboard();
        }

        // ⭐️ เปลี่ยนระบบเซฟข้อมูลให้ผูกกับ User ID (uid) ของคนที่ล็อกอินอยู่
        function getStorageKey() {
            return 'myExpenseDataV5_' + window.currentUser.uid;
        }

        function loadData() {
            const savedData = localStorage.getItem(getStorageKey());
            return savedData ? JSON.parse(savedData) : []; // ถ้าไม่มีข้อมูล คืนค่าเป็น Array ว่าง
        }

        function saveData() {
            localStorage.setItem(getStorageKey(), JSON.stringify(expenses));
            updateCategoryDatalist();
        }

        // (โค้ดส่วน Logic ฟอร์ม, กราฟ, ลบ, แก้ไข ของเดิมทั้งหมดนำมาใส่ต่อตรงนี้ได้เลย โดยตัด loadData() ออก เพราะเราเขียนใหม่ด้านบนแล้ว)
        // ... เพื่อให้โค้ดทำงานได้เบื้องต้น ผมจะจำลองฟังก์ชันวาดตารางแบบย่อให้ครับ
        
        function updateMonthlyDashboard() {
            document.getElementById('monthDisplay').innerText = currentDateView.toLocaleDateString('th-TH', { year: 'numeric', month: 'long' });
            const tableBody = document.getElementById('expenseTableBodyMonthly');
            tableBody.innerHTML = ''; 
            
            expenses.forEach(exp => {
                tableBody.innerHTML += `<tr>
                    <td>-</td><td>${exp.date}</td><td>${exp.item}</td><td>${exp.category}</td><td>฿${exp.amount.toLocaleString()}</td>
                    <td><button onclick="deleteExpense(${exp.id})" class="btn-action-delete">ลบ</button></td>
                </tr>`;
            });
        }
        
        window.deleteExpense = function(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            saveData();
            updateMonthlyDashboard();
        };

        function changeMonth(offset) { currentDateView.setMonth(currentDateView.getMonth() + offset); updateMonthlyDashboard(); }
        function switchView(mode) { /* โลจิกสลับแท็บเดิม */ }
        function toggleInstallmentUI() { /* โลจิกซ่อนแสดงฟอร์มผ่อนเดิม */ }
        function updateCategoryDatalist() { /* โลจิกหมวดหมู่เดิม */ }

        // ฟอร์ม Submit สร้างข้อมูล (แบบย่อ)
        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            expenses.push({ 
                id: Date.now(), 
                date: document.getElementById('expDate').value, 
                item: document.getElementById('expItem').value, 
                category: document.getElementById('expCategory').value, 
                amount: parseFloat(document.getElementById('expAmount').value), 
                isPaid: false 
            });
            saveData();
            updateMonthlyDashboard();
        });

    </script>
</body>
</html>
