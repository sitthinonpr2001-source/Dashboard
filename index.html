<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard - Pro Version</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* === UI/UX Upgrade: ปรับปรุงฟอนต์และสีพื้นหลัง === */
        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #2b2d42;
            --gray: #8d99ae;
            --light-bg: #f8f9fa;
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: var(--dark); 
        }
        
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: var(--dark); margin-bottom: 30px; font-weight: 600; }
        
        /* ระบบแท็บ */
        .tab-container { display: flex; justify-content: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { background: none; border: none; padding: 12px 30px; font-size: 16px; font-weight: 500; cursor: pointer; color: var(--gray); border-bottom: 3px solid transparent; transition: all 0.3s; font-family: inherit; }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* ตัวเลือกเดือน/ปี */
        .time-selector { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 25px; }
        .time-selector button { padding: 8px 20px; cursor: pointer; border: none; background-color: white; color: var(--primary); border-radius: 20px; font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; font-family: inherit;}
        .time-selector button:hover { background-color: var(--primary); color: white; }
        .time-selector span { font-size: 22px; font-weight: 600; color: var(--dark); min-width: 180px; text-align: center; }

        /* การ์ดต่างๆ ให้ดูมีมิติมากขึ้น */
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; border: 1px solid #edf2f7; }
        
        .summary-cards { display: flex; gap: 20px; margin-bottom: 25px; }
        .summary-card { flex: 1; text-align: center; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #edf2f7; transition: transform 0.2s;}
        .summary-card:hover { transform: translateY(-5px); }
        .summary-card h3 { margin: 0 0 10px 0; color: var(--gray); font-size: 16px; font-weight: 500;}
        .summary-card p { margin: 0; font-size: 32px; font-weight: 600; }
        .text-primary { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        /* ปรับปรุงฟอร์ม */
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .form-group div { display: flex; flex-direction: column; flex: 1; min-width: 160px; }
        .form-group label { margin-bottom: 8px; font-size: 14px; color: var(--dark); font-weight: 500; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; transition: 0.2s;}
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15); }
        
        .installment-highlight { background-color: #fff9db; padding: 15px; border-radius: 8px; border: 1px dashed var(--warning); }

        .btn-submit { padding: 12px 24px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; height: 45px; transition: 0.2s; font-family: inherit;}
        .btn-submit:hover { background-color: var(--primary-hover); }
        .btn-cancel { padding: 12px 24px; background-color: var(--gray); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; height: 45px; display: none; font-family: inherit;}

        /* แถบเครื่องมือ Filter & Sort (ของใหม่!) */
        .filter-bar { display: flex; gap: 15px; flex-wrap: wrap; background: var(--light-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; align-items: center;}
        .filter-bar input, .filter-bar select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 14px; outline: none; flex: 1; min-width: 120px;}
        .filter-title { font-weight: 600; color: var(--gray); margin-right: 10px; display: flex; align-items: center; gap: 5px;}

        /* ตารางและกราฟ */
        .content { display: flex; gap: 20px; }
        .chart-container { width: 35%; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .table-container { width: 65%; overflow-y: auto; max-height: 500px; padding: 0; } /* เอา padding ออกเพื่อให้ Header ติดขอบ */
        .content.yearly-layout { flex-direction: column; }
        .content.yearly-layout .chart-container { width: 100%; height: 350px; }
        .content.yearly-layout .table-container { width: 100%; max-height: none; }

        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #edf2f7; }
        th { background-color: #f8fafc; color: var(--dark); font-weight: 600; position: sticky; top: 0; z-index: 1; border-bottom: 2px solid #e2e8f0;}
        tr:hover td { background-color: #f8fafc; }
        
        .paid-row td { color: var(--gray); }
        
        /* ป้ายสถานะ (Badge) */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; text-align: center; min-width: 60px;}
        .badge.paid { background-color: #d1fae5; color: #059669; }
        .badge.pending { background-color: #fee2e2; color: #dc2626; }

        /* Custom Checkbox */
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--success); }

        .btn-action-edit { background-color: var(--warning); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-right: 5px; font-family: inherit;}
        .btn-action-delete { background-color: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: inherit;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Dashboard บันทึกรายจ่าย</h1>

        <div class="tab-container">
            <button class="tab-btn active" id="btnTabMonth" onclick="switchView('month')">บันทึกและจัดการ (รายเดือน)</button>
            <button class="tab-btn" id="btnTabYear" onclick="switchView('year')">สรุปภาพรวม (รายปี)</button>
        </div>

        <div id="viewMonthly">
            <div class="time-selector">
                <button onclick="changeMonth(-1)">&#9664; เดือนก่อนหน้า</button>
                <span id="monthDisplay">เดือน ปี</span>
                <button onclick="changeMonth(1)">เดือนถัดไป &#9654;</button>
            </div>

            <div class="card">
                <form id="expenseForm">
                    <div class="form-group">
                        <div>
                            <label>วันที่ชำระ</label>
                            <input type="date" id="expDate" required>
                        </div>
                        <div style="flex: 2;">
                            <label>ชื่อรายการค่าใช้จ่าย</label>
                            <input type="text" id="expItem" placeholder="เช่น ค่าโฆษณา, ค่าเช่าที่" required>
                        </div>
                        <div>
                            <label>หมวดหมู่</label>
                            <input type="text" id="expCategory" list="categoryOptions" placeholder="พิมพ์/เลือกหมวดหมู่" required autocomplete="off">
                            <datalist id="categoryOptions"></datalist>
                        </div>
                        
                        <div>
                            <label>รูปแบบการจ่าย</label>
                            <select id="expPaymentType" onchange="toggleInstallmentUI()">
                                <option value="full">เต็มจำนวน</option>
                                <option value="installment">ผ่อนชำระรายเดือน</option>
                            </select>
                        </div>

                        <div id="installmentContainer" class="installment-highlight" style="display: none;">
                            <label>จำนวนเดือนที่ผ่อน</label>
                            <input type="number" id="expInstallmentMonths" value="3" min="2" max="60">
                        </div>

                        <div>
                            <label id="amountLabel">จำนวนเงิน (บาท)</label>
                            <input type="number" id="expAmount" placeholder="0.00" min="0" step="0.01" required>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="btn-submit">+ บันทึกรายจ่าย</button>
                        <button type="button" id="cancelBtn" class="btn-cancel" onclick="cancelEdit()">ยกเลิก</button>
                    </div>
                </form>
            </div>

            <div class="summary-cards">
                <div class="summary-card">
                    <h3>ยอดรวมเดือนนี้</h3>
                    <p id="totalExpenseMonthly" class="text-primary">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>จ่ายแล้ว</h3>
                    <p id="paidExpenseMonthly" class="text-success">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>ยอดค้างชำระ</h3>
                    <p id="pendingExpenseMonthly" class="text-danger">฿0</p>
                </div>
            </div>

            <div class="content">
                <div class="card chart-container">
                    <canvas id="monthlyChart"></canvas>
                </div>
                <div class="card table-container">
                    
                    <div class="filter-bar">
                        <div class="filter-title">🔍 ตัวกรอง:</div>
                        <input type="text" id="filterSearch" placeholder="ค้นหาชื่อรายการ..." onkeyup="renderMonthlyTable()">
                        
                        <select id="filterStatus" onchange="renderMonthlyTable()">
                            <option value="all">สถานะทั้งหมด</option>
                            <option value="paid">จ่ายแล้ว</option>
                            <option value="pending">ค้างชำระ</option>
                        </select>

                        <select id="filterCategoryDropdown" onchange="renderMonthlyTable()">
                            <option value="all">ทุกหมวดหมู่</option>
                            </select>

                        <div class="filter-title" style="margin-left: 10px;">⇅ จัดเรียง:</div>
                        <select id="sortData" onchange="renderMonthlyTable()">
                            <option value="date-asc">วันที่ (เก่า - ใหม่)</option>
                            <option value="date-desc">วันที่ (ใหม่ - เก่า)</option>
                            <option value="amount-desc">จำนวนเงิน (มาก - น้อย)</option>
                            <option value="amount-asc">จำนวนเงิน (น้อย - มาก)</option>
                        </select>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: center; width: 40px;">✓</th>
                                <th style="width: 100px;">วันที่</th>
                                <th>รายการ</th>
                                <th>หมวดหมู่</th>
                                <th>จำนวนเงิน</th>
                                <th style="width: 120px; text-align: center;">สถานะ</th>
                                <th style="width: 120px;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBodyMonthly"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="viewYearly" style="display: none;">
            <div class="time-selector">
                <button onclick="changeYear(-1)">&#9664; ปีก่อนหน้า</button>
                <span id="yearDisplay">ปี 2026</span>
                <button onclick="changeYear(1)">ปีถัดไป &#9654;</button>
            </div>

            <div class="summary-cards">
                <div class="summary-card">
                    <h3>ยอดรวมทั้งปี</h3>
                    <p id="totalExpenseYearly" class="text-primary">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>จ่ายแล้วทั้งปี</h3>
                    <p id="paidExpenseYearly" class="text-success">฿0</p>
                </div>
                <div class="summary-card">
                    <h3>ค้างชำระทั้งหมด</h3>
                    <p id="pendingExpenseYearly" class="text-danger">฿0</p>
                </div>
            </div>

            <div class="content yearly-layout">
                <div class="card chart-container">
                    <canvas id="yearlyChart"></canvas>
                </div>
                <div class="card table-container" style="padding: 20px;">
                    <table>
                        <thead>
                            <tr>
                                <th>เดือน</th>
                                <th>ยอดรวมรายจ่าย</th>
                                <th>จ่ายชำระแล้ว</th>
                                <th>ค้างชำระ</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBodyYearly"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. State & Data Management ---
        let expenses = loadData();
        let currentDateView = new Date(); 
        let currentYearView = new Date().getFullYear();
        let editingId = null; 

        function loadData() {
            const savedData = localStorage.getItem('myExpenseDataV4');
            return savedData ? JSON.parse(savedData) : [];
        }

        function saveData() {
            localStorage.setItem('myExpenseDataV4', JSON.stringify(expenses));
            updateCategoryData(); // อัปเดตทั้ง Datalist และ Dropdown ใน Filter
        }

        // --- 2. UI Updates (Categories & UI Toggles) ---
        function toggleInstallmentUI() {
            const isInstallment = document.getElementById('expPaymentType').value === 'installment';
            document.getElementById('installmentContainer').style.display = isInstallment ? 'flex' : 'none';
            document.getElementById('amountLabel').innerText = isInstallment ? 'ยอดรวมทั้งหมด (บาท)' : 'จำนวนเงิน (บาท)';
        }

        function updateCategoryData() {
            const uniqueCategories = [...new Set(expenses.map(exp => exp.category))].sort();
            
            // 1. อัปเดตช่อง Datalist (สำหรับพิมพ์เพิ่ม)
            const datalist = document.getElementById('categoryOptions');
            datalist.innerHTML = uniqueCategories.map(cat => `<option value="${cat}">`).join('');

            // 2. อัปเดตช่อง Dropdown ตัวกรอง (Filter)
            const filterDropdown = document.getElementById('filterCategoryDropdown');
            const currentSelected = filterDropdown.value; // จำค่าที่เลือกไว้ก่อนหน้า
            
            filterDropdown.innerHTML = '<option value="all">ทุกหมวดหมู่</option>' + 
                uniqueCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            
            // พยายามเลือกค่าเดิมถ้ายังมีอยู่
            if (uniqueCategories.includes(currentSelected)) {
                filterDropdown.value = currentSelected;
            }
        }

        // --- 3. Tabs ---
        function switchView(mode) {
            document.getElementById('btnTabMonth').classList.remove('active');
            document.getElementById('btnTabYear').classList.remove('active');
            
            if(mode === 'month') {
                document.getElementById('btnTabMonth').classList.add('active');
                document.getElementById('viewMonthly').style.display = 'block';
                document.getElementById('viewYearly').style.display = 'none';
                updateMonthlyDashboard();
            } else {
                document.getElementById('btnTabYear').classList.add('active');
                document.getElementById('viewMonthly').style.display = 'none';
                document.getElementById('viewYearly').style.display = 'block';
                updateYearlyDashboard();
            }
        }

        // --- 4. Monthly View Logic ---
        let monthlyChartInstance = null;

        function updateMonthlyDashboard() {
            // อัปเดตส่วนหัวและการคำนวณ "ยอดรวมของการ์ดด้านบน" (คำนวณทั้งหมดของเดือน ไม่สน Filter)
            document.getElementById('monthDisplay').innerText = currentDateView.toLocaleDateString('th-TH', { year: 'numeric', month: 'long' });
            const currentMonthPrefix = `${currentDateView.getFullYear()}-${String(currentDateView.getMonth() + 1).padStart(2, '0')}`;
            
            const monthExpenses = expenses.filter(exp => exp.date.startsWith(currentMonthPrefix));
            
            let total = 0, paid = 0, pending = 0;
            const categoryTotals = {};

            monthExpenses.forEach(exp => {
                total += exp.amount;
                if (exp.isPaid) paid += exp.amount; else pending += exp.amount;
                categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + exp.amount;
            });

            document.getElementById('totalExpenseMonthly').innerText = '฿' + total.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('paidExpenseMonthly').innerText = '฿' + paid.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('pendingExpenseMonthly').innerText = '฿' + pending.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });

            updateMonthlyChart(categoryTotals);
            
            // เรียกฟังก์ชันวาดตารางแยกต่างหาก (เพื่อให้ Filter ทำงานเฉพาะตาราง)
            renderMonthlyTable();
        }

        // ฟังก์ชันใหม่: จัดการคัดกรอง, จัดเรียง และ วาดตาราง (Filter, Sort & Render)
        function renderMonthlyTable() {
            const currentMonthPrefix = `${currentDateView.getFullYear()}-${String(currentDateView.getMonth() + 1).padStart(2, '0')}`;
            let displayData = expenses.filter(exp => exp.date.startsWith(currentMonthPrefix));

            // 1. นำข้อมูลมา Filter (ค้นหา, สถานะ, หมวดหมู่)
            const searchText = document.getElementById('filterSearch').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const categoryFilter = document.getElementById('filterCategoryDropdown').value;

            displayData = displayData.filter(exp => {
                const matchSearch = exp.item.toLowerCase().includes(searchText) || exp.category.toLowerCase().includes(searchText);
                const matchStatus = statusFilter === 'all' ? true : (statusFilter === 'paid' ? exp.isPaid : !exp.isPaid);
                const matchCategory = categoryFilter === 'all' ? true : (exp.category === categoryFilter);
                return matchSearch && matchStatus && matchCategory;
            });

            // 2. นำข้อมูลมา Sort (จัดเรียง)
            const sortMethod = document.getElementById('sortData').value;
            displayData.sort((a, b) => {
                if (sortMethod === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (sortMethod === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (sortMethod === 'amount-desc') return b.amount - a.amount;
                if (sortMethod === 'amount-asc') return a.amount - b.amount;
            });

            // 3. วาดตาราง
            const tableBody = document.getElementById('expenseTableBodyMonthly');
            tableBody.innerHTML = ''; 

            if (displayData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 30px; color: #8d99ae;">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>';
                return;
            }

            displayData.forEach(exp => {
                const rowClass = exp.isPaid ? 'paid-row' : '';
                const isChecked = exp.isPaid ? 'checked' : '';
                const badgeHtml = exp.isPaid 
                    ? '<span class="badge paid">จ่ายแล้ว</span>' 
                    : '<span class="badge pending">ค้างชำระ</span>';
                
                tableBody.innerHTML += `<tr class="${rowClass}">
                    <td style="text-align: center;"><input type="checkbox" onchange="togglePayment(${exp.id})" ${isChecked}></td>
                    <td>${exp.date}</td>
                    <td style="font-weight: 500;">${exp.item}</td>
                    <td>${exp.category}</td>
                    <td style="font-weight: 600;">฿${exp.amount.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                    <td style="text-align: center;">${badgeHtml}</td>
                    <td>
                        <button class="btn-action-edit" onclick="editExpense(${exp.id})">✎ แก้ไข</button>
                        <button class="btn-action-delete" onclick="deleteExpense(${exp.id})">✕ ลบ</button>
                    </td>
                </tr>`;
            });
        }

        function changeMonth(offset) {
            currentDateView.setMonth(currentDateView.getMonth() + offset);
            if(editingId) cancelEdit();
            updateMonthlyDashboard();
        }

        // --- 5. มุมมองรายปี (คงเดิมตามการแก้ไขล่าสุด) ---
        let yearlyChartInstance = null;
        const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

        function updateYearlyDashboard() {
            document.getElementById('yearDisplay').innerText = `ปี ${currentYearView}`;
            const filteredExpenses = expenses.filter(exp => exp.date.startsWith(currentYearView.toString()));

            let totalYear = 0, paidYear = 0, pendingYear = 0;
            let monthlyData = Array.from({length: 12}, () => ({ total: 0, paid: 0, pending: 0 }));

            filteredExpenses.forEach(exp => {
                totalYear += exp.amount;
                if (exp.isPaid) paidYear += exp.amount; else pendingYear += exp.amount;
                const monthIndex = parseInt(exp.date.split('-')[1]) - 1; 
                monthlyData[monthIndex].total += exp.amount;
                if (exp.isPaid) monthlyData[monthIndex].paid += exp.amount; else monthlyData[monthIndex].pending += exp.amount;
            });

            document.getElementById('totalExpenseYearly').innerText = '฿' + totalYear.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('paidExpenseYearly').innerText = '฿' + paidYear.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            document.getElementById('pendingExpenseYearly').innerText = '฿' + pendingYear.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });

            const tableBody = document.getElementById('expenseTableBodyYearly');
            tableBody.innerHTML = '';
            let hasData = false;
            monthlyData.forEach((data, index) => {
                if (data.total > 0) {
                    hasData = true;
                    tableBody.innerHTML += `<tr>
                        <td style="font-weight: 500;">${monthNames[index]}</td>
                        <td class="text-primary" style="font-weight: 600;">฿${data.total.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                        <td class="text-success">฿${data.paid.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                        <td class="text-danger">฿${data.pending.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</td>
                    </tr>`;
                }
            });

            if(!hasData) tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">ไม่มีข้อมูลรายจ่ายในปีนี้</td></tr>';
            updateYearlyChart(monthlyData);
        }

        function changeYear(offset) { currentYearView += offset; updateYearlyDashboard(); }

        // --- 6. กราฟ ---
        function updateMonthlyChart(dataTotals) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if (monthlyChartInstance) monthlyChartInstance.destroy();
            const labels = Object.keys(dataTotals);
            const data = Object.values(dataTotals);

            if(labels.length === 0) {
                 monthlyChartInstance = new Chart(ctx, { type: 'pie', data: { labels: ['ไม่มีข้อมูล'], datasets: [{ data: [1], backgroundColor: ['#edf2f7'] }] }});
                 return;
            }
            monthlyChartInstance = new Chart(ctx, {
                type: 'doughnut', // เปลี่ยนเป็นทรงโดนัทให้ดูทันสมัยขึ้น
                data: { labels: labels, datasets: [{ data: data, backgroundColor: ['#4361ee', '#3f37c9', '#4cc9f0', '#f72585', '#b5179e', '#7209b7'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, cutout: '65%' }
            });
        }

        function updateYearlyChart(monthlyData) {
            const ctx = document.getElementById('yearlyChart').getContext('2d');
            if (yearlyChartInstance) yearlyChartInstance.destroy();
            const chartData = monthlyData.map(data => data.total);

            yearlyChartInstance = new Chart(ctx, {
                type: 'bar', 
                data: { labels: monthNames, datasets: [{ label: 'ยอดใช้จ่ายรวม (บาท)', data: chartData, backgroundColor: '#4361ee', borderRadius: 6, minBarLength: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { borderDash: [5, 5] } }, x: { grid: { display: false } } } }
            });
        }

        // --- 7. CRUD Operations ---
        window.togglePayment = function(id) {
            const expenseIndex = expenses.findIndex(exp => exp.id === id);
            if (expenseIndex !== -1) {
                expenses[expenseIndex].isPaid = !expenses[expenseIndex].isPaid;
                saveData(); updateMonthlyDashboard();
            }
        };

        window.deleteExpense = function(id) {
            if (confirm('ยืนยันการลบข้อมูลรายการนี้?')) {
                expenses = expenses.filter(exp => exp.id !== id);
                if (editingId === id) cancelEdit();
                saveData(); updateMonthlyDashboard();
            }
        };

        window.editExpense = function(id) {
            const target = expenses.find(exp => exp.id === id);
            if (target) {
                editingId = id;
                document.getElementById('expDate').value = target.date;
                document.getElementById('expItem').value = target.item;
                document.getElementById('expCategory').value = target.category;
                document.getElementById('expAmount').value = target.amount;
                
                document.getElementById('expPaymentType').value = 'full';
                document.getElementById('expPaymentType').disabled = true; 
                toggleInstallmentUI();

                const btn = document.getElementById('submitBtn');
                btn.innerText = '💾 บันทึกการแก้ไข';
                btn.style.backgroundColor = 'var(--warning)';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.getElementById('expenseForm').scrollIntoView({ behavior: 'smooth' });
            }
        };

        window.cancelEdit = function() {
            editingId = null;
            document.getElementById('expenseForm').reset();
            document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
            
            document.getElementById('expPaymentType').disabled = false;
            toggleInstallmentUI(); 

            const btn = document.getElementById('submitBtn');
            btn.innerText = '+ บันทึกรายจ่าย';
            btn.style.backgroundColor = 'var(--primary)';
            document.getElementById('cancelBtn').style.display = 'none';
        };

        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputDateStr = document.getElementById('expDate').value;
            const inputItem = document.getElementById('expItem').value;
            const inputCategory = document.getElementById('expCategory').value;
            const totalAmount = parseFloat(document.getElementById('expAmount').value);
            const paymentType = document.getElementById('expPaymentType').value;

            if (editingId !== null) {
                const index = expenses.findIndex(exp => exp.id === editingId);
                if (index !== -1) {
                    expenses[index].date = inputDateStr;
                    expenses[index].item = inputItem;
                    expenses[index].category = inputCategory;
                    expenses[index].amount = totalAmount;
                }
            } else {
                if (paymentType === 'installment') {
                    const monthsCount = parseInt(document.getElementById('expInstallmentMonths').value);
                    const amountPerMonth = totalAmount / monthsCount; 
                    const startDate = new Date(inputDateStr);

                    for (let i = 0; i < monthsCount; i++) {
                        let nextDate = new Date(startDate.getFullYear(), startDate.getMonth() + i, startDate.getDate());
                        let formattedDate = `${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}-${String(nextDate.getDate()).padStart(2, '0')}`;
                        expenses.push({ id: Date.now() + i, date: formattedDate, item: `${inputItem} (งวดที่ ${i+1}/${monthsCount})`, category: inputCategory, amount: amountPerMonth, isPaid: false });
                    }
                } else {
                    expenses.push({ id: Date.now(), date: inputDateStr, item: inputItem, category: inputCategory, amount: totalAmount, isPaid: false });
                }
            }

            saveData();
            currentDateView = new Date(inputDateStr); 
            
            // รีเซ็ตตัวกรองเวลามีการเพิ่มข้อมูลใหม่ เพื่อให้เห็นข้อมูลที่เพิ่งเพิ่ม
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterCategoryDropdown').value = 'all';
            
            updateMonthlyDashboard();
            cancelEdit();
        });

        // --- 8. Initialize ---
        document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
        updateCategoryData(); 
        switchView('month');

    </script>
</body>
</html>
